name: Extract ZIP file and Commit

on:
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Name of the ZIP file to extract"
        required: true
        default: "phaglp-platform28012026-master.zip"
      extract_path:
        description: "Directory to extract files into"
        required: true
        default: "./extracted"
      commit_changes:
        description: "Commit extracted files back to repo?"
        required: false
        default: "true"

jobs:
  extract-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # needed for pushing changes

      - name: Ensure extraction directory exists
        run: mkdir -p "${{ github.event.inputs.extract_path }}"

      - name: Extract ZIP file
        run: |
          unzip -o "${{ github.event.inputs.zip_file }}" -d "${{ github.event.inputs.extract_path }}"
          echo "✅ Zip file extracted to ${{ github.event.inputs.extract_path }}"

      - name: Commit extracted files to repo
        if: ${{ github.event.inputs.commit_changes == 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ github.event.inputs.extract_path }}
          git commit -m "Add extracted files from ${{ github.event.inputs.zip_file }}"
          git push
